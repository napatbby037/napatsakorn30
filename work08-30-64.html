<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>work8 html layout</title>
<style>
*{
box-sizing:border-box;
margin:0;
padding:0;

}

.container{
        width:1024px;
        margin:0 auto;
}



header{
    background-images:url(images/header.jpg);
    height:200px;
}
section{
    display:flex;

}
nav{
    background-color:green;
    height:400px;
    flex:1;
}
article{
    background-color:blue;
    height:400px;
    flex:3;
}
footer{
    background-color:yellow;
    height:80px;
}
a:link{
    color:pink;
    text-decoration:none;
    background-color:#E3B856;
    display:block;
    width:100%;
    padding:10px;
}
a:visited{
    color:green;
}
a:hover{
    color:#fff;
    background-color:#7556E3;

}
a:active{
    color:blue;
}


</style>
</head>
<body>
<div class="container">

<header>
</header>

<section>
<nav>
<ul style="list-style-type:none;">
<li><a href="">มะม่วงหาวมะนาวโห่ (มะนาวไม่รู้โห่)</a> </li>
<li><a href="">อะโวคาโด </a> </li>
<li><a href="">มังคุด </a> </li>
<li><a href="">แก้วมังกร </a> </li>
<li><a href="">สับปะรด</a> </li>
</ul>
</nav>
<article>
</article>
</section>

<footer>
</footer>

</div>

</body>
